# fast 系統: 市場・重要ニュース (Hacker News / BOJ・Fed RSS / 市場価格)
# 毎時 0 分は GitHub 側が混雑し遅延・破棄されるためずらす。
# public リポジトリなら standard runner は無料枠消費なし。
name: collect-fast
on:
  schedule:
    - cron: "17 * * * *"        # 毎時17分 (約60分間隔)
  workflow_dispatch:

concurrency:
  group: collect-fast
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run fast collectors
        env:
          INTEL_HUB_INGEST_URL: ${{ secrets.INTEL_HUB_INGEST_URL }}
          INTEL_HUB_INGEST_TOKEN: ${{ secrets.INTEL_HUB_INGEST_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m scripts.run_collectors --tier fast --sink worker
