# slow 系統: arXiv / YouTube / FRED / SEC EDGAR (6時間間隔)
name: collect-slow
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

concurrency:
  group: collect-slow
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run slow collectors
        env:
          INTEL_HUB_INGEST_URL: ${{ secrets.INTEL_HUB_INGEST_URL }}
          INTEL_HUB_INGEST_TOKEN: ${{ secrets.INTEL_HUB_INGEST_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python -m scripts.run_collectors --tier slow --sink worker
