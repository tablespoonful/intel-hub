name: deploy
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "db/schema.sql"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets and variables > Actions (docs/operations.md)"
            exit 1
          fi
        working-directory: .
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
      # db/schema.sql uses only CREATE ... IF NOT EXISTS, so re-applying it on
      # every deploy is a no-op for existing tables and adds any new ones.
      - name: Apply schema to D1
        run: npx wrangler d1 execute intel-hub --remote --file=../db/schema.sql --yes
      - name: Deploy Worker
        run: npx wrangler deploy
