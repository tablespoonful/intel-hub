[project]
name = "intel-hub"
version = "0.1.0"
description = "Personal AI / technology / financial intelligence hub (zero-cost operation)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["collectors*", "pipeline*", "scripts*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
