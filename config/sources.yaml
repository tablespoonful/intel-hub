# =====================================================================
# intel-hub source definitions
#
# method:
#   rss     : RSS / Atom feed (feedparser)
#   api     : 公式 API
#   none    : RSS/API が存在しない。スクレイピングはしない (方針)。
#             url は「公式発表ページ」の記録のみで、collector は実行しない。
# quality : 0.0-1.0 source_quality スコア成分
# tier    : fast / normal / slow (GitHub Actions の実行系統)
# verified: false の feed は URL 未検証。404 時は collector が stale として記録。
# =====================================================================

rss:
