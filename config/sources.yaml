# ---------------------------------------------------------------------
# GitHub 監視リポジトリ (github collector / tier: normal)
# ---------------------------------------------------------------------
github:
  repos:
    - openai/openai-python
    - anthropics/claude-code
    - anthropics/anthropic-sdk-python
    - deepseek-ai/DeepSeek-V3
    - QwenLM/Qwen3
    - huggingface/transformers
    - huggingface/lerobot
    - vllm-project/vllm
    - ggml-org/llama.cpp
    - langchain-ai/langchain
    - microsoft/autogen
    - modelcontextprotocol/servers
    - NVIDIA/Isaac-GR00T
    - isaac-sim/IsaacLab
    - google-deepmind/mujoco
    - Genesis-Embodied-AI/Genesis
    - Physical-Intelligence/openpi
    - unitreerobotics/unitree_rl_gym
    - SakanaAI/AI-Scientist
    - pfnet/pfrl

# ---------------------------------------------------------------------
# Hugging Face (huggingface collector / tier: normal)
# ---------------------------------------------------------------------
huggingface:
  search_keywords:
    - llm
    - agent
    - reasoning
    - vlm
    - vla
    - robotics
    - embodied
    - world model
    - physical ai
    - humanoid
  limit_per_keyword: 30

# ---------------------------------------------------------------------
# arXiv (papers collector / tier: slow)
# ---------------------------------------------------------------------
arxiv:
  categories:
    - cs.AI
    - cs.CL
    - cs.LG
    - cs.RO
    - cs.CV
  max_results: 200

# ---------------------------------------------------------------------
# Hacker News (tier: fast)
# ---------------------------------------------------------------------
hackernews:
  lists: [topstories, newstories]
  max_items_per_list: 60
  min_points_top: 20

# ---------------------------------------------------------------------
# YouTube (tier: slow) — 既知チャンネルは uploads playlist で quota 節約
# channel_id は UC... 形式。search は使わない (1日100回の独立枠のため)。
# ---------------------------------------------------------------------
youtube:
  channels:
    - id: UCXZCJLdBC09xxGZ6gcdrc6A   # OpenAI
      name: OpenAI
      country: US
    - id: UCP7jMXSY2xbc3KCAE0MHQ-A   # Google DeepMind
      name: Google DeepMind
      country: US
    - id: UCHhYXsLBEVVnbvsq57n1MTQ   # Anthropic
      name: Anthropic
      country: US
    - id: UCsBjURrPoezykLs9EqgamOA   # Fireship (AI/tech news)
      name: Fireship
      country: US
    - id: UCbfYPyITQ-7l4upoX8nvctg   # Two Minute Papers
      name: Two Minute Papers
      country: US
  max_videos_per_channel: 10

# ---------------------------------------------------------------------
# Macro (tier: fast の macro_rss / slow の sec_edgar)
# ---------------------------------------------------------------------
macro:
  boj:
    # 日本銀行 公式 RSS (What's New)。2026-08 検証済み。
    # 補足: 2026-02 に時系列統計の公式 API (stat-search.boj.or.jp/api/v1) が公開済み。
    #       時系列データが必要になったら collector 追加を検討 (docs/limitations.md)。
    - id: boj-whatsnew
      name: Bank of Japan What's New
      method: rss
      url: https://www.boj.or.jp/en/rss/whatsnew.xml
      country: JP
      language: en
      category: central_bank
      quality: 0.95
  fed:
    - id: fed-press
      name: Federal Reserve Press Releases
      method: rss
      url: https://www.federalreserve.gov/feeds/press_all.xml
      country: US
      language: en
      category: central_bank
      quality: 0.95
  sec_edgar:
    # CIK は 10 桁ゼロ埋め。監視銘柄の 8-K / 10-Q / 10-K を取得。
    companies:
      - { cik: "0001045810", ticker: NVDA,  name: NVIDIA }
      - { cik: "0000002488", ticker: AMD,   name: AMD }
      - { cik: "0001730168", ticker: AVGO,  name: Broadcom }
      - { cik: "0000789019", ticker: MSFT,  name: Microsoft }
      - { cik: "0001652044", ticker: GOOGL, name: Alphabet }
      - { cik: "0001326801", ticker: META,  name: Meta }
      - { cik: "0001018724", ticker: AMZN,  name: Amazon }
      - { cik: "0001318605", ticker: TSLA,  name: Tesla }
      - { cik: "0001046179", ticker: TSM,   name: TSMC ADR }
    forms: ["8-K", "10-Q", "10-K"]
